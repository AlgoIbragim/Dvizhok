[package]
name = "lumina_script"
version = "0.1.0"
edition = "2021"

[dependencies]
lumina_core = { path = "../core" }
lumina_scene = { path = "../scene" }

# Scripting options (we'll use Rust hot reload)
libloading = "0.8"
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }

# Async
tokio = { version = "1.35", features = ["rt-multi-thread"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"