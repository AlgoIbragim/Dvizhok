[package]
name = "lumina_render"
version = "0.1.0"
edition = "2021"

[dependencies]
lumina_core = { path = "../core" }

# Rendering
wgpu = { version = "0.20", features = ["spirv"] }
winit = { version = "0.29", features = ["rwh_06"] }

# Shader compilation
naga = { version = "0.19", features = ["wgsl-in", "wgsl-out", "glsl-in", "spv-in", "spv-out"] }

# Image loading/processing
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }

# Math
glam = { version = "0.28", features = ["bytemuck"] }
bytemuck = { version = "1.14", features = ["derive"] }

# GPU memory management
gpu-allocator = { version = "0.25", optional = true }

# Render graph
petgraph = "0.6"
slotmap = "1.0"

# Profiling
profiling = { version = "1.0", optional = true }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

[features]
default = ["profiling"]
profiler = ["profiling", "profiling/profile-with-tracy"]
gpu-alloc = ["gpu-allocator"]

[dev-dependencies]
rand = "0.8"